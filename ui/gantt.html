<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    
    <link rel="stylesheet" href="gantt.css" />

    <title>Gantt Chart UI</title>
  </head>
  <body>
    <!-- Pop-up container for adding a new task -->
      <div class="task-popup-modal" hidden>
        <form class="input-task-details">
          <h2>Add New Task</h2>

          <!-- Task Name -->
          <div class="task-input-container">
            <label for="task-name">Task name</label>
            <input
              type="text"
              id="task-name"
              name="taskName"
              required
              placeholder="Enter task name"
            />
          </div>

          <!-- Start Date -->
          <div class="task-input-container">
            <label for="task-start-date">Start date</label>
            <input type="date" id="task-start-date" name="startDate" required />
          </div>

          <!-- End Date -->
          <div class="task-input-container">
            <label for="task-end-date">End date</label>
            <input type="date" id="task-end-date" name="endDate" required />
          </div>

          <!-- Select Team -->
          <div class="task-input-container">
            <label for="task-team">Select team</label>
            <select id="task-team" name="taskTeam">
              <option value="">-- Choose a Team --</option>
              <option value="engineering">Engineering</option>
              <option value="design">Design</option>
              <option value="marketing">Marketing</option>
            </select>
          </div>

          <!-- Assign To -->
          <div class="task-input-container">
            <label for="task-assignee">Assign to</label>
            <input
              type="text"
              id="task-assignee"
              name="taskAssignee"
              placeholder="e.g., Jane Doe"
            />
          </div>
          <div class="task-input-container">
            <label for="task-dependencies">Add Dependencies</label>
            <input
              type="text"
              id="task-dependencies"
              name="taskDependencies"
              placeholder="e.g., Task 1, Task 2"
            />
          </div>
          <!-- Form Actions -->
          <div class="task-form-actions">
            <button type="button" id="btn-cancel" class="btn-cancel" >Cancel</button>
            <button type="submit" class="btn-submit">Add Task</button>
          </div>
        </form>
      </div>

      <!--Overlay Container To stop interacting with main app while modal is open-->
      <div class="overlay" hidden></div>

      <!--Toast Message-->
      <div class="taost-success">
        Success done!
      </div>

    <!--Header Section -->
    <header>
      <h1>Gantt Chart UI</h1>
    </header>

    <!--Main Content Area-->
    <main >
      <!--The Sidebar Seciton-->
      <section class="sec-1">
        <aside class="task-list">
          <div class="add-new-task-container">
            <button type="button" id="add-new-task-btn">
              + Add New Task
            </button>
          </div>
          <div class="todo-list">
            <h3>Todo <span>(33)</span></h3>
            <div class="todo-todos"></div>
          </div>
          <div class="in-progress-list">
            <h3>In Progress <span>(30)</span></h3>
            <div class="in-progress-todos"></div>
          </div>
          <div class="in-review-list">
            <h3>In Review <span>(10)</span></h3>
            <div class="in-review-todos"></div>
          </div>
          <div class="done-list">
            <h3>Done <span>(20)</span></h3>
            <div class="done-todos"></div>
          </div>
        </aside>
      </section>

      <!--The Main Gantt Chart View-->
      <section class="sec-2">
        <div class="main-gantt-area-wrapper">This</div>
      </section>
    </main>
    <footer>
      <p>This is the footer section!</p>
    </footer>
    <!--Add your logic files here or add into the head using deffer keyword-->
    <script src="gantt.js"></script>
  </body>
</html>
