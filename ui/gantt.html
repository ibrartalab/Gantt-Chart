<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>
    <link rel="stylesheet" href="gantt.css" />
    <title>Gantt Chart UI</title>
  </head>
  <body>
    <header>
      <h1>Gantt Chart UI</h1>
    </header>
    <main>
      <section class="sec-1">
        <aside class="task-list">
          <div class="add-new-task-container">
            <button class="add-new-task-btn">+ Add New Task</button>
          </div>
          <div class="todo-list">
            <h3>Todo <span>(33)</span></h3>
            <div class="todo-todos"></div>
          </div>
          <div class="in-progress-list">
            <h3>In Progress <span>(30)</span></h3>
            <div class="in-progress-todos"></div>
          </div>
          <div class="in-review-list">
            <h3>In Review <span>(10)</span></h3>
            <div class="in-review-todos"></div>
          </div>
          <div class="done-list">
            <h3>Done <span>(20)</span></h3>
            <div class="done-todos"></div>
          </div>
        </aside>
      </section>
      <section class="sec-2">
        <div class="main-gantt-area-wrapper">This</div>
      </section>
    </main>
    <footer>
      <p>This is the footer section!</p>
    </footer>
  </body>
</html>
