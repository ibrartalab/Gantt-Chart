                } else {
                    li.style.backgroundColor = '#2a6f97'
                }

                    item1.innerHTML = `start date: ${startDate}`
                    item2.innerHTML = `end date: ${endDate}`
                    span.append(item1, item2)

                    newBoxRow.appendChild(divForDate)
